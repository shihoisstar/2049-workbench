name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wb
          POSTGRES_PASSWORD: wb_dev_only
          POSTGRES_DB: workbench
        ports:
          - 5433:5432 # 与本地 infra/docker-compose 一致,测试/drizzle 默认连接串零配置
        options: >-
          --health-cmd "pg_isready -U wb -d workbench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本读根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # pnpm 11.21.0 要求 Node ≥22.13(node:sqlite);与本地 v24 对齐
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: secret scan(gitleaks,与本地 check-secrets 双保险)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: db migrate(版本化迁移,大厂纪律:不用 push)
        run: pnpm --filter @wb/api db:migrate
      - name: gate (lint+typecheck+test+contract-diff)
        run: pnpm gate
