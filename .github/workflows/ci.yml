name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本读根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # pnpm 11.21.0 要求 Node ≥22.13(node:sqlite);与本地 v24 对齐
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: gate (lint+typecheck+test+contract-diff)
        run: pnpm gate
